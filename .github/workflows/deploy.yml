name: Build and deploy Pokémon usage viewer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh Smogon data before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Daily at 10:17 UTC.
    - cron: '17 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore Smogon raw cache
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        uses: actions/cache@v4
        with:
          # Covers cache/stats (USUM) and cache/gen5 (immutable old-gen moveset
          # files), so Gen 5 history isn't re-fetched on every refresh.
          path: cache
          key: smogon-stats-${{ runner.os }}-${{ hashFiles('scripts/config.mjs', 'scripts/build-data.mjs', 'scripts/build-gen5-items.mjs') }}
          restore-keys: |
            smogon-stats-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Refresh data
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        run: npm run refresh:data

      - name: Commit refreshed generated data
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data/data
          git diff --cached --quiet || git commit -m "Refresh generated Smogon data"
          git push || true

      - name: Build static site
        run: npm run build:site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The site payload is large (multi-GB of usage data), and the Pages
      # file-sync phase intermittently gives up with "Deployment failed, try
      # again later" — a deploy-side flake, not a build failure. Retry once
      # before declaring the run failed.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
