name: Build and deploy Pokémon usage viewer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh Smogon data before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Daily at 10:17 UTC.
    - cron: '17 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore Smogon raw cache
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        uses: actions/cache@v4
        with:
          path: cache/stats
          key: smogon-stats-${{ runner.os }}-${{ hashFiles('scripts/config.mjs', 'scripts/build-data.mjs') }}
          restore-keys: |
            smogon-stats-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Refresh data
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        run: npm run build:data -- --refresh-current

      - name: Commit refreshed generated data
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Refresh generated Smogon data"
          git push || true

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
