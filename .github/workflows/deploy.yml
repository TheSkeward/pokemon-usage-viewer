name: Build and deploy Pokémon usage viewer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 10:17 UTC. Static site updates only after this workflow redeploys.
    - cron: '17 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore Smogon raw cache
        uses: actions/cache@v4
        with:
          path: cache/stats
          key: smogon-stats-${{ runner.os }}-${{ hashFiles('scripts/config.mjs', 'scripts/build-data.mjs') }}
          restore-keys: |
            smogon-stats-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build data
        run: npm run build:data -- --refresh-current

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
