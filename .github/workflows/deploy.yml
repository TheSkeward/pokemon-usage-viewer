name: Build and deploy Pokémon usage viewer

on:
  push:
    branches: [main]
    # Only redeploy when the published site can actually change. Every deploy
    # re-syncs the full multi-GB data payload to Pages (the flaky part), so
    # test-only / docs-only commits shouldn't roll those dice.
    paths:
      - "src/**"
      - "public/**"
      - "site-data/**"
      - "scripts/**"
      - "index.html"
      - "pool.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh Smogon data before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      harvest_only:
        description:
          "Harvest only these scrapers (comma-separated: replays, samples,
          rmt, tournament, forums; empty = all). Runs the harvest without
          requiring refresh_data."
        required: false
        default: ""
        type: string
  schedule:
    # Daily at 10:17 UTC.
    - cron: '17 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore Smogon raw cache
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        uses: actions/cache@v4
        with:
          # Covers cache/stats (USUM) and cache/gen5 (immutable old-gen moveset
          # files), so Gen 5 history isn't re-fetched on every refresh.
          path: cache
          key: smogon-stats-${{ runner.os }}-${{ hashFiles('scripts/config.mjs', 'scripts/build-data.mjs', 'scripts/build-gen5-items.mjs') }}
          restore-keys: |
            smogon-stats-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Keep every deployment gated by the cheap mechanical/correctness suite.
      # Scoring-affecting paths additionally run the badge corpus in the
      # separate scoring-calibration workflow, without forcing docs-only work
      # through a subjective optimizer run.
      - name: Run fast tests
        run: npm test

      - name: Set up Chrome for forum harvest
        id: setup-chrome
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true' || github.event.inputs.harvest_only != ''
        continue-on-error: true
        uses: browser-actions/setup-chrome@v2

      # refresh:data rewrites BOTH trees (site-data/data JSON and the
      # src/generated/*.js modules); build:manifest must run after it so the
      # committed manifest's hashes/dataSignature describe the refreshed data.
      # Historically this step neither regenerated the manifest nor staged
      # src/generated, leaving the repo internally inconsistent after every
      # scheduled run until someone reconciled it by hand (the deployed site
      # was unaffected — build:site regenerates the manifest fresh).
      # Appends to the committed team archives (scripts/teamscrape/archive)
      # before refresh:data so build:observed-sets / build:core-index see the
      # new teams. Scrape failures must not block the data refresh or deploy —
      # the ladders can be quiet and the hosts can be down.
      - name: Harvest competitive teams
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true' || github.event.inputs.harvest_only != ''
        continue-on-error: true
        env:
          SMOGON_FETCH_MODE: browser
          SMOGON_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SMOGON_REQUEST_GAP_MS: 2000
        run: npm run scrape:teams -- --only="${{ github.event.inputs.harvest_only }}"

      - name: Refresh data
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true'
        run: npm run refresh:data && npm run build:manifest

      # Also runs for harvest-only dispatches: the archives and
      # last-harvest.json are the run's whole output, and staging the
      # untouched refresh trees is a no-op.
      - name: Commit refreshed generated data
        if: github.event_name == 'schedule' || github.event.inputs.refresh_data == 'true' || github.event.inputs.harvest_only != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data/data src/generated scripts/teamscrape/archive
          git diff --cached --quiet || git commit -m "Refresh generated Smogon data"
          git push || true

      - name: Build static site
        run: npm run build:site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The site payload is large (multi-GB of usage data), and the Pages
      # file-sync phase intermittently gives up with "Deployment failed, try
      # again later" — a deploy-side flake, not a build failure. Retry once
      # before declaring the run failed.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # Observed 2026-07-06: the attempt AND an immediate retry died in the
      # same Pages backend incident ("try again later", ~90s apart). Wait out
      # the bad window before retrying.
      - name: Wait before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 300

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
